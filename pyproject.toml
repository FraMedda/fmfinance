[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmfinance"
version = "0.0.1"
description = "Financial data utilities for Fama-French and FRED by Francesco M."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "requests",
]

[tool.setuptools]
packages = ["fmfinance"]